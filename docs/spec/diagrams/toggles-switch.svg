<svg xmlns="http://www.w3.org/2000/svg" width="360" height="150" viewBox="0 0 360 150" font-family="Inter, sans-serif" font-size="10">
  <title>Switch, regular size (CT-SW-01), 3× scale</title>
  <rect width="360" height="150" fill="#ffffff"/>
  <!-- 3×: track 54 × 24 pt = 162 × 72 px, radius 12 pt; knob 32 × 20 pt with 2 pt margin. -->
  <rect x="30" y="30" width="162" height="72" rx="36" fill="#0074f8"/>
  <rect x="120" y="36" width="96" height="60" rx="30" fill="#ffffff" stroke="#2266ec" stroke-width="0.5"/>
  <g stroke="#808080" stroke-width="0.75" fill="none">
    <line x1="30" y1="116" x2="192" y2="116"/>
    <line x1="30" y1="112" x2="30" y2="120"/>
    <line x1="192" y1="112" x2="192" y2="120"/>
    <line x1="206" y1="30" x2="206" y2="102"/>
    <line x1="202" y1="30" x2="210" y2="30"/>
    <line x1="202" y1="102" x2="210" y2="102"/>
    <line x1="120" y1="22" x2="216" y2="22"/>
    <line x1="120" y1="18" x2="120" y2="26"/>
    <line x1="216" y1="18" x2="216" y2="26"/>
  </g>
  <g fill="#3a3a3a">
    <text x="111" y="132" text-anchor="middle">track 54 pt</text>
    <text x="214" y="70">24 pt</text>
    <text x="168" y="14" text-anchor="middle">knob 32 × 20 pt</text>
    <text x="250" y="50">on: #0074f8</text>
    <text x="250" y="64">knob: #ffffff</text>
    <text x="250" y="78">margin: 2 pt</text>
    <text x="250" y="92">radius: 12 pt</text>
  </g>
</svg>
