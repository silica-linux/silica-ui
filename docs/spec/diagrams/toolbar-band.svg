<svg xmlns="http://www.w3.org/2000/svg" width="600" height="150" viewBox="0 0 600 150" font-family="Inter, sans-serif" font-size="10">
  <title>Toolbar band and capsules (CT-TL-01), 2× scale</title>
  <rect width="600" height="150" fill="#ffffff"/>
  <!-- 2×: band 52 pt (104 px), capsules 38 pt (76 px) at 7 pt from the top. -->
  <rect x="0" y="0" width="560" height="104" fill="#f3f3f3"/>
  <line x1="0" y1="105" x2="560" y2="105" stroke="#e5e5e5" stroke-width="2"/>
  <g fill="#f8f8f8" stroke="#c1c1c1" stroke-width="1">
    <rect x="20" y="14" width="150" height="76" rx="38"/>
    <rect x="200" y="14" width="236" height="76" rx="38"/>
    <circle cx="482" cy="52" r="38"/>
  </g>
  <line x1="95" y1="31" x2="95" y2="73" stroke="#c7c7c7" stroke-width="2"/>
  <!-- selected pill 34 × 28 inset 5, hover pill 28 tall -->
  <rect x="210" y="24" width="68" height="56" rx="28" fill="#e2e2e2"/>
  <rect x="298" y="24" width="56" height="56" rx="28" fill="#eeeeee" stroke="#b0b0b0" stroke-dasharray="3 2" stroke-width="0.75"/>
  <g stroke="#0064e1" stroke-width="0.75" fill="none">
    <line x1="570" y1="0" x2="570" y2="104"/>
    <line x1="566" y1="0" x2="574" y2="0"/>
    <line x1="566" y1="104" x2="574" y2="104"/>
    <line x1="10" y1="14" x2="10" y2="90"/>
    <line x1="6" y1="14" x2="14" y2="14"/>
    <line x1="6" y1="90" x2="14" y2="90"/>
    <line x1="170" y1="120" x2="200" y2="120"/>
    <line x1="170" y1="116" x2="170" y2="124"/>
    <line x1="200" y1="116" x2="200" y2="124"/>
  </g>
  <g fill="#0064e1">
    <text x="574" y="56">52</text>
    <text x="0" y="56" text-anchor="end">38</text>
    <text x="185" y="136" text-anchor="middle">7–8</text>
  </g>
  <g fill="#808080">
    <text x="210" y="122">selected pill 34 × 28, inset 5 · hover pill 28 tall</text>
    <text x="210" y="136">1 pt line at 52 once the content scrolls</text>
  </g>
</svg>
