<svg xmlns="http://www.w3.org/2000/svg" width="500" height="150" viewBox="0 0 500 150" font-family="Inter, sans-serif" font-size="10">
  <title>Linear slider, regular (CT-SL-03), 2× scale</title>
  <rect width="500" height="150" fill="#ffffff"/>
  <!-- 2×: track 200 pt × 6 pt, knob capsule 20 × 16 pt; fill reaches the knob centre. -->
  <rect x="50" y="64" width="400" height="12" rx="6" fill="#e6e6e6"/>
  <rect x="50" y="64" width="260" height="12" rx="6" fill="#286df5"/>
  <rect x="290" y="54" width="40" height="32" rx="16" fill="#ffffff" stroke="#c8c8c8" stroke-width="0.75"/>
  <line x1="310" y1="44" x2="310" y2="96" stroke="#808080" stroke-dasharray="2 2" stroke-width="0.75"/>
  <g stroke="#0064e1" stroke-width="0.75" fill="none">
    <line x1="50" y1="110" x2="450" y2="110"/>
    <line x1="50" y1="106" x2="50" y2="114"/>
    <line x1="450" y1="106" x2="450" y2="114"/>
    <line x1="290" y1="36" x2="330" y2="36"/>
    <line x1="290" y1="32" x2="290" y2="40"/>
    <line x1="330" y1="32" x2="330" y2="40"/>
    <line x1="470" y1="64" x2="470" y2="76"/>
  </g>
  <g fill="#0064e1">
    <text x="250" y="126" text-anchor="middle">L = 200 pt</text>
    <text x="310" y="28" text-anchor="middle">knob 20 × 16</text>
    <text x="476" y="74">6 pt</text>
  </g>
  <g fill="#808080">
    <text x="50" y="142">knob centre = x₀ + 10 + v · (L − 20) · fill #286df5 · track #e6e6e6</text>
  </g>
</svg>
