name: silica_ui
description: The Silica design system for Flutter. Interface font (Inter, OFL), glass and Liquid Glass composed by Ossido.
# Distributed with git tags (vX.Y.Z) until the name is verified on pub.dev.
publish_to: none
version: 0.19.3
repository: https://github.com/silica-linux/silica-ui

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
