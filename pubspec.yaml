name: silica_ui
description: Design system di Silica per Flutter. Font dell'interfaccia (Inter, OFL), vetro e Liquid Glass composti da Ossido.
# Distribuito con tag git (vX.Y.Z) finché il nome non è verificato per pub.dev.
publish_to: none
version: 0.3.1
repository: https://github.com/silica-linux/silica-ui

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
